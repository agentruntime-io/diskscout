name: Release

# Push a tag such as v1.8.0 and this builds the exe and publishes it on the Releases page, with its SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$v" -o "DiskScout-$v.exe" .
          sha256sum "DiskScout-$v.exe" > "DiskScout-$v.exe.sha256"
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DiskScout-*.exe DiskScout-*.sha256 --generate-notes --title "DiskScout $GITHUB_REF_NAME"
