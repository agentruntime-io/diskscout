name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch: # a maintainer can run it by hand (a release needs a passing run for the commit being tagged)

permissions:
  contents: read

# a newer push to the same branch makes an older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tests have to run on Windows: the app is Windows-only, and they exercise real NTFS behaviour (hardlinks, junctions,
    # system attributes, change notifications). This is the only Windows job; it costs nothing while the repository is public
    # (GitHub does not charge for hosted runners on public repositories). The release build does not use a Windows runner.
    # Stay free: runs only while the repository is public. If it is ever made private this job skips itself (a skipped job is
    # not billed) instead of quietly using the organisation's included minutes, where Windows counts double.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # there are no dependencies to cache
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - name: build
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o DiskScout.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: DiskScout-${{ github.sha }}
          path: DiskScout.exe
